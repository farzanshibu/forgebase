name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  dashboard:
    name: dashboard (build, lint, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the dashboard so rust-embed embeds the real assets
        run: |
          cd dashboard
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  sdk-rust:
    name: sdk/rust (fmt, clippy, test with the live server, deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sdk/rust -> target
      - name: Build the dashboard so rust-embed embeds the real assets
        run: |
          cd dashboard
          npm ci
          npm run build
      - name: Build the server binary the live tests start
        run: cargo build --locked -p forgebase-cli
      - name: Check the SDK
        working-directory: sdk/rust
        env:
          FB_LIVE_BIN: ${{ github.workspace }}/target/debug/forgebase
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: sdk/rust/Cargo.toml
          arguments: --config ${{ github.workspace }}/deny.toml --all-features

  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
