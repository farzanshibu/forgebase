name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly: the PostgreSQL matrix grows to macOS arm64 and Windows, and one
  # Linux row runs with every extension accelerator off (FB-149, FB-158).
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  dashboard:
    name: dashboard (build, lint, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build the dashboard so rust-embed embeds the real assets
        run: |
          cd dashboard
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The functions crate's JavaScript tests time out when every test binary
      # and every test thread runs at once (FB-147): it runs on its own with two
      # test threads, everything else in parallel.
      - run: cargo test --workspace --locked --no-fail-fast --exclude forgebase-functions
      - run: cargo test -p forgebase-functions --locked -- --test-threads=2

  # ---------------------------------------------------------------------------
  # PostgreSQL (FB-149, ADR-0028 §7.7): the same suites, FORGEBASE_TEST_BACKEND=postgres.
  #
  # The engine is the one the engine workflow published (engine.lock
  # engine.release): the Homebrew-style engines lack pgvector and pgmq. The
  # crate tests start one engine per test binary from FORGEBASE_TEST_PG_ENGINE;
  # the black-box suites (tests/integration, the 25 SPEC scenarios) start the
  # managed engine of the `forgebase` binary from FORGEBASE_PG_ENGINE_DIR.
  # ---------------------------------------------------------------------------
  pg-plan:
    name: postgres matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          linux = {
              "name": "linux x86_64", "os": "ubuntu-24.04",
              "target": "x86_64-unknown-linux-musl", "scope": "workspace",
              "accelerators": "auto", "experimental": False,
          }
          rows = [linux]
          if os.environ["EVENT"] in ("schedule", "workflow_dispatch"):
              rows += [
                  # Every accelerator off: the portable code paths on PostgreSQL.
                  {**linux, "name": "linux x86_64, accelerators off", "scope": "portable",
                   "accelerators": "off"},
                  {"name": "macOS arm64", "os": "macos-15", "target": "aarch64-apple-darwin",
                   "scope": "workspace", "accelerators": "auto", "experimental": False},
                  # The Windows engine is new on CI (first built in engine-pg18.6-r8) and the
                  # crate test harness needs Unix sockets: the black-box suites only, and a
                  # failure does not fail the run until the engine is proven there.
                  {"name": "Windows x86_64", "os": "windows-2022", "target": "x86_64-pc-windows-msvc",
                   "scope": "blackbox", "accelerators": "auto", "experimental": True},
              ]
          print("matrix=" + json.dumps({"include": rows}))
          PY

  test-postgres:
    name: postgres (${{ matrix.name }})
    needs: pg-plan
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    permissions:
      contents: read
      # gh run list: whether the engine workflow is still building the release.
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pg-plan.outputs.matrix) }}
    env:
      FORGEBASE_TEST_BACKEND: postgres
      FORGEBASE_TEST_PG_ACCELERATORS: ${{ matrix.accelerators }}
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres-${{ matrix.target }}

      # Short paths: the engine's Unix-socket path is limited to 103 bytes.
      - name: Test engine directory
        run: echo "FORGEBASE_TEST_PG_TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build the dashboard so rust-embed embeds the real assets
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: zstd for the engine archive
        run: |
          command -v zstd >/dev/null 2>&1 && exit 0
          case "$RUNNER_OS" in
            macOS) brew install zstd ;;
            Linux) sudo apt-get install -y -qq zstd ;;
            Windows) choco install zstd -y --no-progress ;;
            *) echo "zstd is not on PATH" >&2; exit 1 ;;
          esac

      # An engine bump pushes engine.lock and its tag together, so this run
      # can start before the engine workflow has published the release it
      # pins (r6–r8 failed every PostgreSQL suite that way). While an engine
      # run for the tag is still going, wait for this target's archive.
      - name: Download and unpack the pinned engine
        id: engine
        run: |
          set -euo pipefail
          release=$(python3 deploy/postgres-engine/engine.py get engine.release)
          published() {
            gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq "[.assets[].name | select(endswith(\"-$TARGET.tar.zst\") or . == \"SHA256SUMS\")] | length" \
              2>/dev/null | grep -qx 2
          }
          building() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow postgres-engine.yml --branch "$release" \
              --json status --jq '[.[] | select(.status != "completed")] | length' | grep -qvx 0
          }
          deadline=$((SECONDS + 45 * 60))
          until published; do
            if ! building; then
              # The run may have finished between the two checks.
              published && break
              echo "::error::release $release has no $TARGET archive and no engine run for it is in progress (push the tag $release, engine.lock engine.release)"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::gave up after 45 minutes waiting for the engine workflow to publish $release"
              exit 1
            fi
            echo "the engine workflow is still building $release; waiting"
            sleep 60
          done
          mkdir -p "$RUNNER_TEMP/engine-dl"
          gh release download "$release" --repo "$GITHUB_REPOSITORY" \
            -p "forgebase-pg*-$TARGET.tar.zst" -p SHA256SUMS -D "$RUNNER_TEMP/engine-dl"
          python3 - "$RUNNER_TEMP/engine-dl" <<'PY'
          import hashlib, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          archive = next(d.glob("forgebase-pg*.tar.zst"))
          want = {l.split()[1].lstrip("*"): l.split()[0] for l in (d / "SHA256SUMS").read_text().splitlines() if l.strip()}
          got = hashlib.sha256(archive.read_bytes()).hexdigest()
          if want.get(archive.name) != got:
              sys.exit(f"{archive.name}: sha256 {got} is not the release's {want.get(archive.name)}")
          print(f"{archive.name} verified ({got})")
          PY
          archive=$(ls "$RUNNER_TEMP"/engine-dl/forgebase-pg*.tar.zst)
          python3 deploy/postgres-engine/engine.py extract "$archive" "$RUNNER_TEMP/engine"
          echo "FORGEBASE_TEST_PG_ENGINE=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"
          echo "FORGEBASE_PG_ENGINE_DIR=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/engine/bin/postgres" --version

      # The 25 SPEC scenarios and the other end-to-end suites against the
      # built binary (docs/qa.md), the binary running its managed PostgreSQL.
      - name: Black-box suites (tests/integration) on PostgreSQL
        if: matrix.scope != 'portable'
        run: cargo test -p forgebase-cli --locked --no-fail-fast -- --test-threads=2

      - name: Every other crate on PostgreSQL
        # Runs even when the black-box step failed, so one CI run lists every
        # failure; without an engine every test would only fail for want of one.
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && matrix.scope == 'workspace' }}
        run: |
          cargo test --workspace --locked --no-fail-fast --exclude forgebase-cli --exclude forgebase-functions
          # JavaScript tests time out under full parallel load (FB-147).
          cargo test -p forgebase-functions --locked -- --test-threads=2

      # Accelerators off: the portable paths. The db and pgengine crates test
      # the extensions themselves, so they stay out of this row.
      - name: Portable run (every accelerator off)
        if: matrix.scope == 'portable'
        run: |
          cargo test --workspace --locked --no-fail-fast --exclude forgebase-db --exclude forgebase-pgengine --exclude forgebase-functions
          cargo test -p forgebase-functions --locked -- --test-threads=2

  js-engine:
    name: functions JavaScript engine (reproducible build)
    # The committed artifact is built on arm64 macOS; the same pinned wasi-sdk
    # binary here makes the check byte-exact.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/js-engine-tools
          key: js-engine-tools-${{ hashFiles('scripts/build-js-engine.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # prelude.ts is the source: it type-checks, and the committed prelude.js
      # is exactly what scripts/build-js-prelude.ts strips it to.
      - run: npx --yes -p typescript@5.9.3 tsc -p crates/forgebase-functions/js/tsconfig.json
      - run: node scripts/build-js-prelude.ts --check
      # Rebuilds QuickJS + engine.c + prelude.js with the pinned wasi-sdk and
      # fails if the result differs from the committed forgebase-js.wasm.
      - run: scripts/build-js-engine.sh --check

  sdk-rust:
    name: sdk/rust (fmt, clippy, test with the live server, deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sdk/rust -> target
      - name: Build the dashboard so rust-embed embeds the real assets
        run: |
          cd dashboard
          npm ci
          npm run build
      - name: Build the server binary the live tests start
        run: cargo build --locked -p forgebase-cli
      - name: Check the SDK
        working-directory: sdk/rust
        env:
          FB_LIVE_BIN: ${{ github.workspace }}/target/debug/forgebase
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: sdk/rust/Cargo.toml
          # The action runs in a container at the workspace root: use a relative path.
          arguments: --config deny.toml --all-features

  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # Kubernetes deployment files: the Helm chart (deploy/helm) and the Kustomize
  # base, overlays and components (deploy/kubernetes). Lints and renders every
  # variant, validates the output against the Kubernetes and CRD schemas, and
  # checks that single-writer violations are refused.
  kubernetes:
    name: kubernetes manifests (helm, kustomize, kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: helm lint, helm template and kubeconform
        run: deploy/helm/validate.sh
      - name: kubectl kustomize and kubeconform
        run: deploy/kubernetes/validate.sh
