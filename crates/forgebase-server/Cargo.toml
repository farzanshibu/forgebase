[package]
name = "forgebase-server"
description = "ForgeBase server lifecycle: data-dir lock, database startup, HTTP serving and graceful shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Embed the PostgreSQL engine (FB-130 archive, ADR-0028 §3.1); PostgreSQL then
# becomes the default backend. Without it: the -lite build (SQLite default).
bundled-postgres = ["forgebase-core/bundled-postgres", "forgebase-pgengine/bundled-postgres"]

[dependencies]
axum.workspace = true
forgebase-api.workspace = true
forgebase-backup.workspace = true
forgebase-auth.workspace = true
forgebase-policy.workspace = true
forgebase-data.workspace = true
forgebase-core.workspace = true
forgebase-db.workspace = true
# The bundled PostgreSQL engine, started around Database::open (FB-148).
forgebase-pgengine.workspace = true
forgebase-entitlements.workspace = true
forgebase-credits.workspace = true
forgebase-billing.workspace = true
forgebase-functions.workspace = true
forgebase-customize.workspace = true
forgebase-jobs.workspace = true
forgebase-kv.workspace = true
forgebase-observability.workspace = true
metrics.workspace = true
forgebase-vector.workspace = true
forgebase-resp.workspace = true
forgebase-storage.workspace = true
forgebase-queue.workspace = true
forgebase-realtime.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
# FB-171: real shard clusters (forgebase_db::shard_testing) in tests/shards_fb171.rs.
forgebase-db = { workspace = true, features = ["testing"] }
wat.workspace = true
redis = { workspace = true, features = ["tokio-comp"] }
tempfile.workspace = true
forgebase-graph.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true

[lints]
workspace = true
