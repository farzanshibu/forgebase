[package]
name = "forgebase-cli"
description = "The `forgebase` command: init, serve, migrate, status, doctor, version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "forgebase"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
forgebase-api.workspace = true
forgebase-core.workspace = true
forgebase-db.workspace = true
forgebase-observability.workspace = true
forgebase-server.workspace = true
fs4.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Workspace-level integration tests live in /tests (owned by the repo, not by
# one crate). They are attached here because this package builds the binary
# they drive (CARGO_BIN_EXE_forgebase).
[[test]]
name = "server_lifecycle"
path = "../../tests/integration/server_lifecycle.rs"

[[test]]
name = "cli_e2e"
path = "../../tests/integration/cli_e2e.rs"

[lints]
workspace = true
