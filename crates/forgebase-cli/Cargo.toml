[package]
name = "forgebase-cli"
description = "The `forgebase` command: init, serve, migrate, status, doctor, backup, restore, export, import, version, admin, functions, project, deploy, new."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "forgebase"
path = "src/main.rs"

[features]
# The standard release: the PostgreSQL engine embedded (FORGEBASE_PG_ENGINE_ARCHIVE
# at build time, checked against engine.lock) and PostgreSQL as the default
# backend. Without it: the -lite build (SQLite default).
bundled-postgres = ["forgebase-server/bundled-postgres"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dotenvy.workspace = true
forgebase-api.workspace = true
forgebase-auth.workspace = true
forgebase-backup.workspace = true
forgebase-convert.workspace = true
forgebase-core.workspace = true
forgebase-data.workspace = true
forgebase-db.workspace = true
forgebase-observability.workspace = true
forgebase-pgengine.workspace = true
forgebase-policy.workspace = true
forgebase-server.workspace = true
fs4.workspace = true
serde.workspace = true
serde_json.workspace = true
# Project as code (ADR-0037): function code digests, project and function files, server URLs.
sha2.workspace = true
time.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
# process: `forgebase db psql` runs the engine's psql.
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

# `init` refuses the bundled PostgreSQL as root before it writes anything.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[dev-dependencies]
# node_e2e mounts the agent endpoints (FB-168) on a test router.
axum.workspace = true
# project_e2e puts a TLS-terminating proxy in front of the server (ADR-0037).
rustls.workspace = true
tokio-rustls.workspace = true
futures-util = { workspace = true, features = ["sink"] }
sha2.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
wat.workspace = true

# Workspace-level integration tests live in /tests (owned by the repo, not by
# one crate). They are attached here because this package builds the binary
# they drive (CARGO_BIN_EXE_forgebase).
[[test]]
name = "server_lifecycle"
path = "../../tests/integration/server_lifecycle.rs"

[[test]]
name = "serve_signal_e2e"
path = "../../tests/integration/serve_signal_e2e.rs"

[[test]]
name = "cli_e2e"
path = "../../tests/integration/cli_e2e.rs"

[[test]]
name = "auth_e2e"
path = "../../tests/integration/auth_e2e.rs"

[[test]]
name = "realtime_e2e"
path = "../../tests/integration/realtime_e2e.rs"

[[test]]
name = "backup_e2e"
path = "../../tests/integration/backup_e2e.rs"

[[test]]
name = "functions_e2e"
path = "../../tests/integration/functions_e2e.rs"

[[test]]
name = "queues_e2e"
path = "../../tests/integration/queues_e2e.rs"

[[test]]
name = "recovery"
path = "../../tests/integration/recovery.rs"

# FB-85: the 25 SPEC §27 scenarios against the built binary (docs/qa.md).
[[test]]
name = "spec_scenarios"
path = "../../tests/integration/spec_scenarios.rs"

# FB-90: first-run setup (setup link, /api/setup/*, init admin flags).
[[test]]
name = "setup_e2e"
path = "../../tests/integration/setup_e2e.rs"

# FB-148: init --database, the backend marker, status, doctor, db status/psql.
[[test]]
name = "backup_pg_e2e"
path = "tests/backup_pg_e2e.rs"

[[test]]
name = "database_e2e"
path = "tests/database_e2e.rs"

# FB-177: the default backend of the build; an existing SQLite project stays.
[[test]]
name = "default_backend_e2e"
path = "tests/default_backend_e2e.rs"

# FB-151: db convert --to postgres|sqlite.
[[test]]
name = "convert_e2e"
path = "tests/convert_e2e.rs"

# FB-168: `forgebase node join` against the agent endpoints.
[[test]]
name = "node_e2e"
path = "tests/node_e2e.rs"

# ADR-0037: `forgebase new`, `project pull|plan|apply|drift` and `deploy` against a real server.
[[test]]
name = "project_e2e"
path = "tests/project_e2e.rs"

[lints]
workspace = true
