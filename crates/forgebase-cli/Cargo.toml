[package]
name = "forgebase-cli"
description = "The `forgebase` command: init, serve, migrate, status, doctor, backup, restore, export, import, version, admin, functions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "forgebase"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dotenvy.workspace = true
forgebase-api.workspace = true
forgebase-auth.workspace = true
forgebase-backup.workspace = true
forgebase-core.workspace = true
forgebase-data.workspace = true
forgebase-db.workspace = true
forgebase-observability.workspace = true
forgebase-server.workspace = true
fs4.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
sha2.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
wat.workspace = true

# Workspace-level integration tests live in /tests (owned by the repo, not by
# one crate). They are attached here because this package builds the binary
# they drive (CARGO_BIN_EXE_forgebase).
[[test]]
name = "server_lifecycle"
path = "../../tests/integration/server_lifecycle.rs"

[[test]]
name = "cli_e2e"
path = "../../tests/integration/cli_e2e.rs"

[[test]]
name = "auth_e2e"
path = "../../tests/integration/auth_e2e.rs"

[[test]]
name = "realtime_e2e"
path = "../../tests/integration/realtime_e2e.rs"

[[test]]
name = "backup_e2e"
path = "../../tests/integration/backup_e2e.rs"

[[test]]
name = "functions_e2e"
path = "../../tests/integration/functions_e2e.rs"

[[test]]
name = "queues_e2e"
path = "../../tests/integration/queues_e2e.rs"

[[test]]
name = "recovery"
path = "../../tests/integration/recovery.rs"

# FB-85: the 25 SPEC §27 scenarios against the built binary (docs/qa.md).
[[test]]
name = "spec_scenarios"
path = "../../tests/integration/spec_scenarios.rs"

[lints]
workspace = true
