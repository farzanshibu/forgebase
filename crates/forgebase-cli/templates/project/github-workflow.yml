# ForgeBase project as code: plan on pull requests, deploy on main.
# Repository secrets: FORGEBASE_URL, FORGEBASE_TOKEN (a service account API key){{SECRET_LIST}}.
name: ForgeBase

on:
  pull_request:
    paths: ["{{DIR}}/**", ".github/workflows/forgebase.yml"]
  push:
    branches: [main]
    paths: ["{{DIR}}/**", ".github/workflows/forgebase.yml"]

permissions:
  contents: read

concurrency:
  group: forgebase-${{ github.ref }}
  cancel-in-progress: false

env:
  FORGEBASE_VERSION: {{VERSION}}
  FORGEBASE_RELEASES: {{RELEASES}}
  FORGEBASE_URL: ${{ secrets.FORGEBASE_URL }}
  FORGEBASE_TOKEN: ${{ secrets.FORGEBASE_TOKEN }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ForgeBase CLI
        run: |
          set -euo pipefail
          name="forgebase-${FORGEBASE_VERSION}-x86_64-unknown-linux-musl-lite"
          curl -fsSLO "${FORGEBASE_RELEASES}/${FORGEBASE_VERSION}/${name}.tar.gz"
          curl -fsSLO "${FORGEBASE_RELEASES}/${FORGEBASE_VERSION}/SHA256SUMS"
          sha256sum -c SHA256SUMS --ignore-missing
          tar -xzf "${name}.tar.gz"
          sudo install -m 0755 "$(find "${name}" -name forgebase -type f | head -n1)" /usr/local/bin/forgebase
          forgebase version
      - name: Validate
        run: forgebase project validate --dir {{DIR}}
      - name: Plan
        # Exit codes: 0 no changes, 2 changes, 1 error.
        run: |
          set +e
          forgebase project plan --dir {{DIR}} > plan.txt
          code=$?
          cat plan.txt
          { echo '### ForgeBase plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install the ForgeBase CLI
        run: |
          set -euo pipefail
          name="forgebase-${FORGEBASE_VERSION}-x86_64-unknown-linux-musl-lite"
          curl -fsSLO "${FORGEBASE_RELEASES}/${FORGEBASE_VERSION}/${name}.tar.gz"
          curl -fsSLO "${FORGEBASE_RELEASES}/${FORGEBASE_VERSION}/SHA256SUMS"
          sha256sum -c SHA256SUMS --ignore-missing
          tar -xzf "${name}.tar.gz"
          sudo install -m 0755 "$(find "${name}" -name forgebase -type f | head -n1)" /usr/local/bin/forgebase
      - name: Deploy
        # Destructive changes (dropping fields, collections or buckets) also need --allow-destructive;
        # deleting resources that are not in the project needs --prune.
        run: forgebase deploy --dir {{DIR}} --auto-approve
        env:{{SECRET_ENV}}
          NO_COLOR: "1"
