[package]
name = "forgebase-auth"
description = "ForgeBase authentication: passwords, sessions, tokens, MFA, API keys, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
argon2.workspace = true
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
forgebase-core.workspace = true
forgebase-data.workspace = true
getrandom.workspace = true
hmac.workspace = true
num-bigint.workspace = true
p256.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true
utoipa.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
tracing.workspace = true
webpki-roots = { workspace = true, optional = true }

[features]
default = ["https"]
# Outbound HTTPS (identity providers, Turnstile, SMS gateways) and LDAPS:
# rustls with the ring provider and the webpki-roots CA bundle (ADR-0015 §2).
https = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dev-dependencies]
forgebase-db.workspace = true
tempfile.workspace = true
tower.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
