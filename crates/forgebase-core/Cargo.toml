[package]
name = "forgebase-core"
description = "Shared ForgeBase foundations: configuration, error model, data-directory layout and build info."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Builds that embed the PostgreSQL engine (forgebase-pgengine): PostgreSQL
# becomes the default `[database] backend` (ADR-0029 §6). Off = the -lite build.
bundled-postgres = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
