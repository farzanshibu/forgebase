[package]
name = "forgebase-migrations"
description = "Embedded, checksummed, atomic ForgeBase system migrations for SQLite and PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
forgebase-core.workspace = true
futures-util.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
