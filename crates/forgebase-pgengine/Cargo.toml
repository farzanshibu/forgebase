[package]
name = "forgebase-pgengine"
description = "ForgeBase bundled PostgreSQL engine: discovery, extraction and verification, initdb, bootstrap roles, configuration, supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Embed the engine archive named by FORGEBASE_PG_ENGINE_ARCHIVE (ADR-0028 §3.1).
# build.rs checks its SHA-256 against engine.lock and never downloads anything.
bundled-postgres = []

[dependencies]
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Readiness and bootstrap SQL over the Unix socket (same driver as forgebase-db).
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
# Engine archives (ADR-0028 §3.1); both already in the offline registry cache.
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.13.3", default-features = false }
# PT_INTERP relocation of Linux engines (ADR-0028 §2.3).
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }

[target.'cfg(unix)'.dependencies]
# Signals, euid and liveness checks with a safe API (the workspace forbids unsafe).
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[build-dependencies]
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
# The managed engine's URLs must open through the backend facade (FB-131).
forgebase-core.workspace = true
forgebase-db.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[lints]
workspace = true
