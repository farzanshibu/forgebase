[package]
name = "forgebase-db"
description = "ForgeBase primary database: SQLite in WAL mode or PostgreSQL, each with one writer connection and a read pool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test databases on both backends (ADR-0028 §7.7); dev-dependencies only.
testing = ["dep:tempfile"]

[dependencies]
forgebase-core.workspace = true
forgebase-migrations.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
forgebase-db = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
