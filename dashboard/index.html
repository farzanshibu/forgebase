<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ForgeBase Admin</title>
    <!-- Theme before first paint, so there is no flash. Same keys and ids as src/theme/theme.ts. -->
    <script id="theme-init">
      (function () {
        var root = document.documentElement;
        var mode = "system";
        var accent = "amber";
        try {
          var m = window.localStorage.getItem("forgebase.admin.theme");
          if (m === "light" || m === "dark" || m === "system") mode = m;
          var a = window.localStorage.getItem("forgebase.admin.accent");
          if (/^(amber|indigo|emerald|rose|sky|violet)$/.test(a || "")) accent = a;
        } catch (e) {}
        var dark = mode === "dark";
        if (mode === "system") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
        }
        root.classList.toggle("dark", dark);
        root.setAttribute("data-accent", accent);
        root.setAttribute("data-theme", mode);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
