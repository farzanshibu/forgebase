[sources.age]
# Apache AGE for PostgreSQL 18 (FB-160, ADR-0029 §1.2-§1.3). The ASF release
# tarball from archive.apache.org (keeps every release; downloads.apache.org
# drops 1.8.0 once a newer PG18 release is out). Its ASF SHA-512
# (apache-age-1.8.0-src.tar.gz.sha512 on downloads.apache.org) was checked
# against this file on 2026-11-11; the build checks the SHA-256 below.
version = "1.8.0"
url = "https://archive.apache.org/dist/age/PG18/1.8.0/apache-age-1.8.0-src.tar.gz"
sha256 = "555736a31974255223778959ca8bcd9cb710b93a8fab1d846eaf3e84704b9417"
asf_sha512 = "8103dc6a4daec0441c2bdfe4e456be619d04526efa5c4e1a5148a29d7e6359e5df7d9a1fabbc6a6a08f6229c4d6f8634b7bf3554eca8ffb58550382542279866"
dir = "apache-age-1.8.0"
licence = "Apache-2.0 (with PostgreSQL-licensed parts; NOTICE shipped as share/licenses/age-NOTICE.txt)"
licence_file = "age/age.txt"
os = ["linux", "macos"]

# Unreleased upstream fixes carried on 1.8.0 (ADR-0029 §9a, decision 1 B),
# applied in this order from deploy/postgres-engine/age/patches/. Each one is
# dropped when an AGE release for PG18 contains it. age/post-install.sh fails
# the build when a file's SHA-256 differs from the one here.
[[sources.age.patches]]
file = "0001-pr2475-detach-delete-rls-segfault.patch"
upstream_pr = "https://github.com/apache/age/pull/2475"
upstream_commit = "2e4b4ad91359b6e4dedbe787b83176f565bf7727"
sha256 = "f62d9ad52221010e62b9d06e659663efe578ff0e0e0b3f2b296d9a40bd3781ed"
note = "upstream commit verbatim"

[[sources.age.patches]]
