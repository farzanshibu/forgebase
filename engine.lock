# engine.lock: pins the bundled PostgreSQL engine (ADR-0028 §2.2, ADR-0029 §1.3, FB-130).
#
# Read by deploy/postgres-engine/ (every table) and by
# crates/forgebase-pgengine/build.rs ([archives.*] only: the SHA-256 the
# embedded archive must have for the target being built).
#
# Every source is downloaded from its official upstream and checked against
# the SHA-256 below before it is unpacked. `os` lists the target families
# that build it; `licence_file` names the file under
# THIRD_PARTY_LICENSES/postgres/ that the archive ships as
# share/licenses/<licence_file> (checked by `engine.py check-licences`).

[engine]
postgres = "18.6"
build = "r1"
release = "engine-pg18.6-r1"
# Lowest macOS the engine runs on (Apple silicon starts at 11).
macos_deployment_target = "11.0"
# Linux: the build image and the musl loader copied into lib/.
alpine_image = "alpine:3.20"
musl = "1.2.5"

[contents]
# Programs kept in bin/ (ADR-0028 §1, plus the helpers other shipped
# programs run: pg_upgrade runs pg_resetwal, pg_dumpall and psql;
# pg_verifybackup runs pg_waldump). Everything else in bin/ is dropped.
programs = [
  "postgres", "initdb", "pg_ctl", "pg_basebackup", "pg_verifybackup",
  "pg_waldump", "pg_dump", "pg_dumpall", "pg_restore", "pg_upgrade",
  "pg_resetwal", "pg_controldata", "pg_isready", "psql",
]
# contrib modules built and shipped (ADR-0028 §1, ADR-0029 §1.2).
contrib = [
  "citext", "pgcrypto", "pg_trgm", "unaccent", "fuzzystrmatch", "btree_gin",
  "btree_gist", "hstore", "ltree", "intarray", "tablefunc",
  "pg_stat_statements", "amcheck",
]
# Third-party extensions, built after contrib in this order. One more
# extension with patches (Apache AGE, FB-160) goes in
# deploy/postgres-engine/extensions/<name>/ and is listed here.
extensions = ["pgvector", "pg_cron", "pgmq"]

[sources.postgresql]
version = "18.6"
url = "https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2"
sha256 = "555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f"
licence = "PostgreSQL"
licence_file = "postgresql.txt"
os = ["linux", "macos", "windows"]

[sources.pgvector]
version = "0.8.7"
url = "https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.7.tar.gz"
sha256 = "cac0b10c360f05b2d521200105ba3697e773d4cd3731f5a915a7e37ebe0bea85"
dir = "pgvector-0.8.7"
licence = "PostgreSQL"
licence_file = "pgvector.txt"
os = ["linux", "macos", "windows"]

[sources.pg_cron]
version = "1.6.8"
url = "https://github.com/citusdata/pg_cron/archive/refs/tags/v1.6.8.tar.gz"
sha256 = "c19ab9bb35406c60fb51ecda993737c083850abe424acb6c1030439d00a1f8e4"
dir = "pg_cron-1.6.8"
licence = "PostgreSQL"
licence_file = "pg_cron.txt"
os = ["linux", "macos", "windows"]

[sources.pgmq]
version = "1.13.1"
url = "https://github.com/pgmq/pgmq/archive/refs/tags/v1.13.1.tar.gz"
sha256 = "67221f288f42f95c002a64df40f7d660e765e32df8ada0f2672ba915a14827f7"
dir = "pgmq-1.13.1"
licence = "PostgreSQL"
licence_file = "pgmq.txt"
os = ["linux", "macos", "windows"]

[sources.openssl]
version = "3.5.9"
url = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz"
sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
licence = "Apache-2.0"
licence_file = "openssl.txt"
os = ["linux", "macos", "windows"]

[sources.zlib]
# macOS links the system zlib (/usr/lib/libz.1.dylib), so it is not built there.
version = "1.4"
url = "https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.gz"
sha256 = "02dd159783677a749c04adbdd02b55b8a2bcc7e054f51b76b549199a916ad584"
licence = "Zlib"
licence_file = "zlib.txt"
os = ["linux", "windows"]

[sources.lz4]
version = "1.11.1"
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.11.1.tar.gz"
sha256 = "683fed08a844ad012196381e40badf80c0bbe4962959761416d41c9e67d77ec7"
licence = "BSD-2-Clause"
licence_file = "lz4.txt"
os = ["linux", "macos", "windows"]

[sources.zstd]
version = "1.5.7"
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
licence = "BSD-3-Clause"
licence_file = "zstd.txt"
os = ["linux", "macos", "windows"]

[sources.libedit]
# psql line editing on Linux (BSD, not GPL readline). macOS links the system
# libedit (/usr/lib/libedit.3.dylib); Windows psql has none.
version = "20260512-3.1"
url = "https://www.thrysoee.dk/editline/libedit-20260512-3.1.tar.gz"
sha256 = "432d5e7ea8b0116dd39f2eca7bc11d0eed77faa6b77ea526ace89907c23ea4a0"
licence = "BSD-3-Clause"
licence_file = "libedit.txt"
os = ["linux"]

# Components linked or copied from the Linux build image rather than built
# from a pinned tarball: they still need a licence file in the archive.
[bundled.musl]
version = "1.2.5"
from = "alpine:3.20 /lib/ld-musl-<arch>.so.1 (copied to lib/)"
licence = "MIT"
licence_file = "musl.txt"
os = ["linux"]

[bundled.ncurses]
version = "6.4"
from = "alpine:3.20 ncurses-static (linked into psql through libedit)"
licence = "X11"
licence_file = "ncurses.txt"
os = ["linux"]

# Engine archives, one per target. build.rs reads `sha256`; a target without
# it is not built yet (status "pending-ci") and a bundled-postgres build for
# it fails with "engine.lock has no archive entry". After a CI release,
# replace these tables with the release's engine.lock.archives fragment.
[archives."aarch64-apple-darwin"]
file = "forgebase-pg18.6-r1-aarch64-apple-darwin.tar.zst"
sha256 = "c5a23a423b28d934a41688d0b3947260fa50d32cea2af087c132c7d39ced5396"
size = 7661698
# Built and smoke-tested locally by FB-130 (Apple clang 21, macOS 27 SDK);
# two clean builds in different work directories gave these bytes. The CI
# release archive will differ: replace this table with the release's
# engine.lock.archives fragment.
status = "local"

[archives."x86_64-apple-darwin"]
file = "forgebase-pg18.6-r1-x86_64-apple-darwin.tar.zst"
status = "pending-ci"

[archives."x86_64-unknown-linux-musl"]
file = "forgebase-pg18.6-r1-x86_64-unknown-linux-musl.tar.zst"
status = "pending-ci"

[archives."aarch64-unknown-linux-musl"]
file = "forgebase-pg18.6-r1-aarch64-unknown-linux-musl.tar.zst"
status = "pending-ci"

[archives."x86_64-pc-windows-msvc"]
file = "forgebase-pg18.6-r1-x86_64-pc-windows-msvc.tar.zst"
status = "pending-ci"
