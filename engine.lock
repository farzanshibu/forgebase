# The Windows engine did not finish on CI for engine-pg18.6-r1: the zstd CLI
# step failed once (fixed), then the PostgreSQL meson step printed nothing for
# 111 minutes until the 120-minute job limit. build-windows.ps1 now limits and
# diagnoses that step; the engine ships in a later engine release.
[archives."x86_64-pc-windows-msvc"]
file = "forgebase-pg18.6-r1-x86_64-pc-windows-msvc.tar.zst"
status = "pending-ci"
