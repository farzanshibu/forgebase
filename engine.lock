upstream_pr = "https://github.com/apache/age/pull/2561"
upstream_commit = "3eeb20bd967875cb32158d495396916d85697a51"
sha256 = "8ae84d4ac59c6e013bb14a3218442f7e0bb566dcb573bae64ee9edadbd40ace1"
note = "upstream commit verbatim"

[[sources.age.patches]]
file = "0003-pr2578-utility-commands-without-age.patch"
upstream_pr = "https://github.com/apache/age/pull/2578"
upstream_commit = "6e073cf40917731b4cd5b2654e4a93da005a2295"
sha256 = "46da0aa2c42698679ea033977b255af5f654301b9195b4729119c487bc19de8d"
