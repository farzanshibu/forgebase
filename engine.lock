# Components linked or copied from the Linux build image rather than built
# from a pinned tarball: they still need a licence file in the archive.
[bundled.musl]
version = "1.2.5"
from = "alpine:3.20 /lib/ld-musl-<arch>.so.1 (copied to lib/)"
licence = "MIT"
licence_file = "musl.txt"
os = ["linux"]

[bundled.ncurses]
version = "6.4"
from = "alpine:3.20 ncurses-static (linked into psql through libedit)"
licence = "X11"
licence_file = "ncurses.txt"
os = ["linux"]

# Engine archives, one per target. build.rs reads `sha256`; a target without
# it is not built yet (status "pending-ci") and a bundled-postgres build for
# it fails with "engine.lock has no archive entry". After a CI release,
# replace these tables with the release's engine.lock.archives fragment.
[archives."aarch64-apple-darwin"]
file = "forgebase-pg18.6-r1-aarch64-apple-darwin.tar.zst"
sha256 = "707ab0d5772ceeba9aee693583ed69afa1cb022458d231de3d94a0774d242dcf"

