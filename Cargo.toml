[workspace]
resolver = "3"
members = ["crates/*", "tests/topology"]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/farzanshibu/forgebase"

[workspace.dependencies]
# internal crates
forgebase-core = { path = "crates/forgebase-core" }
forgebase-observability = { path = "crates/forgebase-observability" }
forgebase-migrations = { path = "crates/forgebase-migrations" }
forgebase-db = { path = "crates/forgebase-db" }
forgebase-pgengine = { path = "crates/forgebase-pgengine" }
forgebase-api = { path = "crates/forgebase-api" }
forgebase-server = { path = "crates/forgebase-server" }
forgebase-schema = { path = "crates/forgebase-schema" }
forgebase-query = { path = "crates/forgebase-query" }
forgebase-data = { path = "crates/forgebase-data" }
forgebase-graph = { path = "crates/forgebase-graph" }
forgebase-jobs = { path = "crates/forgebase-jobs" }
forgebase-auth = { path = "crates/forgebase-auth" }
forgebase-policy = { path = "crates/forgebase-policy" }
forgebase-kv = { path = "crates/forgebase-kv" }
forgebase-vector = { path = "crates/forgebase-vector" }
forgebase-resp = { path = "crates/forgebase-resp" }
forgebase-realtime = { path = "crates/forgebase-realtime" }
forgebase-entitlements = { path = "crates/forgebase-entitlements" }
forgebase-storage = { path = "crates/forgebase-storage" }
forgebase-credits = { path = "crates/forgebase-credits" }
forgebase-functions = { path = "crates/forgebase-functions" }
forgebase-billing = { path = "crates/forgebase-billing" }
forgebase-customize = { path = "crates/forgebase-customize" }
forgebase-queue = { path = "crates/forgebase-queue" }
forgebase-backup = { path = "crates/forgebase-backup" }
forgebase-insights = { path = "crates/forgebase-insights" }
forgebase-convert = { path = "crates/forgebase-convert" }

# third party (versions and licences recorded in docs/adr/0002-dependencies.md)
anyhow = "1.0.104"
num-bigint = { version = "0.5.1", default-features = false, features = ["std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "arithmetic", "pkcs8", "pem", "std"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = { version = "0.15.7", default-features = false }
getrandom = "0.4.3"
hmac = "0.13.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
http-body-util = "0.1.5"
metrics = "0.24.6"
memory-stats = "1.2.0"
cpu-time = "1.0.0"
redis = { version = "=0.32.7", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mime_guess = { version = "2.0.5", default-features = false }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Store receipt and notification signatures (FB-72, ADR-0021 §9): already in the
# tree through rustls; used directly for ECDSA/RSA, AES-GCM and X.509 chains.
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["alloc", "ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = "0.11.1"
subtle = { version = "2.6.1", default-features = false }
# `regexp`: SQLite's REGEXP in Rust (`regex`, already in the tree), for the
# Unicode case-insensitive `~` of the filter language on SQLite.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "regexp", "tls-rustls-ring-webpki"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time", "sync", "io-util"] }
toml = "1.2.1"
# Comment-preserving writes of forgebase.toml (FB-91, PATCH /api/system/config). MIT OR Apache-2.0.
toml_edit = { version = "0.25.18", default-features = false, features = ["parse", "display"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
usearch = { version = "2.26.6", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
uuid = { version = "1.29.1", features = ["v4"] }
# Wasm runtime for server functions (FB-60, ADR-0017). Apache-2.0 WITH LLVM-exception.
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "cranelift", "async", "std"] }
wat = "=1.261.0"
# TypeScript to JavaScript for JS/TS functions (FB-93, ADR-0027). MIT.
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_codegen = { version = "=0.155.0", default-features = false, features = ["sourcemap"] }
oxc_diagnostics = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_transformer = "=0.155.0"
webpki-roots = "1.0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Dev/test builds: keep line tables for backtraces, drop full debug info.
# Cuts target/ size by more than half; several worktrees build in parallel on one disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
