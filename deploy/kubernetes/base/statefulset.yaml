apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgebase
spec:
  # One replica, always: ForgeBase has a single writer and holds a lock on its
  # data directory. Do not scale this up.
  replicas: 1
  serviceName: forgebase-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: forgebase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgebase
    spec:
      serviceAccountName: forgebase
      automountServiceAccountToken: false
      # Kubernetes would inject FORGEBASE_PORT=tcp://… for a Service named
      # "forgebase", and the binary rejects unknown FORGEBASE_* variables.
      enableServiceLinks: false
      # The server drains requests for server.shutdown_timeout_secs (30), then
      # checkpoints and stops PostgreSQL.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # Only fix ownership when the volume's root is wrong: a recursive change
        # would loosen the 0700/0600 modes ForgeBase and PostgreSQL insist on.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgebase
          image: ghcr.io/farzanshibu/forgebase
          args: ["serve"]
          env:
            - name: FORGEBASE_CONFIG
              value: /etc/forgebase/forgebase.toml
            - name: FORGEBASE_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          # /health: the process answers. /health/ready: the database and
          # storage answer and the migrations are applied. The startup probe
          # allows 15 minutes for the first start (engine unpack, initdb,
          # migrations) and for upgrades.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/forgebase
              readOnly: true
      volumes:
        - name: config
          configMap:
            # Generated by the overlay (configMapGenerator); kustomize renames
            # this reference to the hashed name, so a config change rolls the pod.
            name: forgebase-config
        # Scratch space: the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # One writer: ReadWriteOnce, or ReadWriteOncePod to forbid a second pod
        # on the node. Never ReadWriteMany.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
