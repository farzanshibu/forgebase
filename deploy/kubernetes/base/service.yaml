apiVersion: v1
kind: Service
metadata:
  name: forgebase
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: forgebase
---
# Governing Service of the StatefulSet (stable pod DNS name).
apiVersion: v1
kind: Service
metadata:
  name: forgebase-headless
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: forgebase
