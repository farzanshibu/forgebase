apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgebase-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgebase-backup
rules:
  # Exec into the ForgeBase pod, and nothing else.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: ["forgebase-0"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    resourceNames: ["forgebase-0"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgebase-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgebase-backup
subjects:
  - kind: ServiceAccount
    name: forgebase-backup
