# ForgeBase with the bundled PostgreSQL engine (standard image). The default.
#
#   kubectl create namespace forgebase
#   kubectl apply -k deploy/kubernetes/overlays/bundled-postgres -n forgebase
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: forgebase-config
    files:
      - forgebase.toml

patches:
  - path: shm-patch.yaml
    target:
      kind: StatefulSet
      name: forgebase
