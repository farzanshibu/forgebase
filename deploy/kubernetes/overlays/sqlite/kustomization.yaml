# ForgeBase on SQLite. Runs on the standard image, or on a -lite image you
# build and push (see the commented line below).
#
#   kubectl apply -k deploy/kubernetes/overlays/sqlite -n forgebase
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: forgebase-config
    files:
      - forgebase.toml

# SQLite needs less. Replace the requests of the base.
patches:
  - target:
      kind: StatefulSet
      name: forgebase
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi

# The -lite image is not published by the release workflow. Build it (the
# Dockerfile without ENGINE_ARCHIVE), push it, and uncomment:
# images:
#   - name: ghcr.io/farzanshibu/forgebase
#     newName: registry.example.com/forgebase
#     newTag: 0.4.0-lite
