# Example only: NOT listed in kustomization.yaml. Prefer
# `kubectl create secret generic forgebase-database --from-literal=url=…`, an
# external-secrets operator or sealed-secrets over committing this file with a
# real password in it.
apiVersion: v1
kind: Secret
metadata:
  name: forgebase-database
type: Opaque
stringData:
  url: postgres://forgebase:CHANGE-ME@db.example.com:5432/forgebase?sslmode=require
