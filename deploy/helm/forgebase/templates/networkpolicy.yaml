{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forgebase.fullname" . }}
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forgebase.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and .Values.resp.enabled .Values.resp.exposeService }}
    - ports:
        - port: resp
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.respFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dnsPodSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egress.allowHttps }}
    # Outbound HTTPS: OAuth/OIDC, SMS, S3, webhooks, payment providers.
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
