{{- include "forgebase.validate" . -}}
{{- $managedPg := include "forgebase.managedPostgres" . -}}
{{- $externalPg := include "forgebase.externalPostgres" . -}}
{{- $backupVolume := include "forgebase.backupVolume" . -}}
{{- /* Environment shared by the server and the bootstrap init container. */ -}}
{{- define "forgebase.env" -}}
- name: FORGEBASE_CONFIG
  value: /etc/forgebase/forgebase.toml
- name: FORGEBASE_DATA_DIR
  value: /data
{{- if include "forgebase.externalPostgres" . }}
- name: FORGEBASE_DATABASE_URL
  valueFrom:
    secretKeyRef:
      name: {{ include "forgebase.databaseSecretName" . }}
      key: {{ include "forgebase.databaseSecretKey" . }}
{{- end }}
{{- with .Values.s3.existingSecret }}
- name: FORGEBASE_STORAGE_S3_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: {{ . }}
      key: {{ $.Values.s3.accessKeyKey }}
- name: FORGEBASE_STORAGE_S3_SECRET_KEY
  valueFrom:
    secretKeyRef:
      name: {{ . }}
      key: {{ $.Values.s3.secretKeyKey }}
{{- with $.Values.s3.sessionTokenKey }}
- name: FORGEBASE_STORAGE_S3_SESSION_TOKEN
  valueFrom:
    secretKeyRef:
      name: {{ $.Values.s3.existingSecret }}
      key: {{ . }}
{{- end }}
{{- end }}
{{- end -}}
{{- /* Mounts shared by the server and the bootstrap init container. */ -}}
{{- define "forgebase.volumeMounts" -}}
- name: data
  mountPath: /data
- name: tmp
  mountPath: /tmp
- name: config
  mountPath: /etc/forgebase
  readOnly: true
{{- if include "forgebase.managedPostgres" . }}
- name: shm
  mountPath: /dev/shm
{{- end }}
{{- if .Values.tls.existingSecret }}
- name: tls
  mountPath: /etc/forgebase-tls
  readOnly: true
{{- end }}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "forgebase.fullname" . }}
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
spec:
  # One replica, always: ForgeBase has a single writer and holds a lock on its
  # data directory. There is deliberately no replicaCount value.
  replicas: 1
  serviceName: {{ include "forgebase.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- if .Values.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.retentionPolicy.whenScaled }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "forgebase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forgebase.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "forgebase.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Kubernetes would inject FORGEBASE_PORT=tcp://… for a Service named
      # "forgebase", and the binary rejects unknown FORGEBASE_* variables.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ int .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.admin.bootstrap.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.admin.bootstrap.enabled }}
        - name: bootstrap-admin
          image: {{ include "forgebase.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # init is idempotent: it migrates the database and keeps an existing
          # administrator. The password goes in on stdin, never on the command line.
          command: ["/bin/sh", "-c"]
          args:
            - printf '%s\n' "$ADMIN_PASSWORD" | exec forgebase --config /etc/forgebase/forgebase.toml init --admin-email "$ADMIN_EMAIL" --admin-password-stdin
          env:
            {{- include "forgebase.env" . | nindent 12 }}
            - name: ADMIN_EMAIL
              value: {{ .Values.admin.bootstrap.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "forgebase.adminSecretName" . }}
                  key: {{ include "forgebase.adminSecretKey" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "forgebase.volumeMounts" . | nindent 12 }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: forgebase
          image: {{ include "forgebase.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            {{- include "forgebase.env" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int .Values.containerPort }}
              protocol: TCP
            {{- if .Values.resp.enabled }}
            - name: resp
              containerPort: {{ int .Values.resp.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
              scheme: {{ include "forgebase.probeScheme" . }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              scheme: {{ include "forgebase.probeScheme" . }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
              scheme: {{ include "forgebase.probeScheme" . }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "forgebase.volumeMounts" . | nindent 12 }}
            {{- if $backupVolume }}
            - name: backups
              mountPath: /backups
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "forgebase.fullname" . }}
        # Scratch space: the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        {{- if $managedPg }}
        # PostgreSQL's shared memory.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if $backupVolume }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "forgebase.backupClaimName" . }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "forgebase.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
