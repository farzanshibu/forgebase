{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forgebase.fullname" . }}-backup
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forgebase.fullname" . }}-backup
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
rules:
  # Exec into this release's pod, and nothing else.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: [{{ include "forgebase.podName" . | quote }}]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    resourceNames: [{{ include "forgebase.podName" . | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forgebase.fullname" . }}-backup
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forgebase.fullname" . }}-backup
subjects:
  - kind: ServiceAccount
    name: {{ include "forgebase.fullname" . }}-backup
    namespace: {{ .Release.Namespace }}
{{- end }}
