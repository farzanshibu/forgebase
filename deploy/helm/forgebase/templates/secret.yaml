{{- /* Secrets the chart writes only when you give a value inline. Prefer the existingSecret settings. */ -}}
{{- if and (include "forgebase.externalPostgres" .) (not .Values.database.postgres.external.existingSecret) .Values.database.postgres.external.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forgebase.databaseSecretName" . }}
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.postgres.external.url | quote }}
{{- end }}
{{- if and .Values.admin.bootstrap.enabled (not .Values.admin.bootstrap.existingSecret) .Values.admin.bootstrap.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forgebase.adminSecretName" . }}
  labels:
    {{- include "forgebase.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.admin.bootstrap.password | quote }}
{{- end }}
