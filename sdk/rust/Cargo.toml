# Own workspace: the SDK pulls an HTTP client stack the server does not need, so it is
# built and locked apart from the server workspace (docs: README.md, "Build").
[workspace]

[package]
name = "forgebase-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/forgebase/forgebase"
description = "Async Rust client for ForgeBase: auth, records, realtime, storage, KV, functions, jobs, entitlements"
readme = "README.md"

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
hmac = "0.13.0"
sha1 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
