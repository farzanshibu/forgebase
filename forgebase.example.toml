# forgebase.example.toml: every configuration key ForgeBase Phase 1 reads.
#
# Copy to forgebase.toml (or run `forgebase init`, which writes an equivalent
# file). Every value below is the built-in default, so this file changes
# nothing until you edit a value.
#
# Precedence (highest first): command-line flags > FORGEBASE_* environment
# variables > this file > built-in defaults. Unknown keys are errors.
#
# Modules (ADR-0026): every `[<section>] enabled` below is a switch, on by
# default except the Redis listener. A module that is off answers
# 404 feature_disabled on its routes and starts no workers. Administrators can
# read and change these settings with GET /api/system/features and
# PATCH /api/system/config (applied after a restart).

# Data directory: the database, storage/, indexes/, backups/, tmp/.
# Relative paths resolve against the directory of this file.
# Env: FORGEBASE_DATA_DIR   Flag: --data-dir
data_dir = "forgebase-data"

[server]
# Bind address. Loopback by default because admin endpoints have no login yet.
# Env: FORGEBASE_HOST   Flag: --host
host = "127.0.0.1"

# TCP port. 0 picks a free port (useful in tests).
# Env: FORGEBASE_PORT   Flag: --port
port = 8090

# Per-request timeout, seconds. Allowed range 1..=3600.
# Env: FORGEBASE_REQUEST_TIMEOUT_SECS
request_timeout_secs = 30

# Grace period for in-flight requests on shutdown, seconds. Range 1..=3600.
# Env: FORGEBASE_SHUTDOWN_TIMEOUT_SECS
shutdown_timeout_secs = 30

# Address people and apps reach this server at, such as
# https://forgebase.example.com: http:// or https://, no path. Links the server
# hands out (such as the setup link) start with it. Unset: the bound address.
# Env: FORGEBASE_PUBLIC_URL
# public_url = "https://forgebase.example.com"

[database]
# Engine: "postgres" (PostgreSQL: the bundled server, or your own with
# [database.postgres] mode = "external") or "sqlite" (one file,
# <data_dir>/forgebase.db). The default is "postgres" in the standard release
# and "sqlite" in the -lite release (`forgebase --version` says which), so the
# key is commented out here. `forgebase init --database` writes it. The data
# directory records what it holds in forgebase.backend: an existing project
# keeps its engine, and a setting that contradicts it stops startup; moving a
# project to the other engine is `forgebase db convert`.
# Env: FORGEBASE_DATABASE_BACKEND
# backend = "postgres"

# The SQLite keys below apply to backend = "sqlite" only.
# "full": fsync the WAL on every commit, so committed data survives power loss.
# "normal": faster, but a power cut can lose the most recent commits.
# Env: FORGEBASE_DB_SYNCHRONOUS
synchronous = "full"

# How long a connection waits for another process's lock (CLI migrate, doctor,
# backups), milliseconds. Maximum 600000.
# Env: FORGEBASE_DB_BUSY_TIMEOUT_MS
busy_timeout_ms = 5000

# Parallel read-only connections. Range 1..=64.
# Env: FORGEBASE_DB_READ_POOL_SIZE
read_pool_size = 8

# PostgreSQL (backend = "postgres"; ADR-0028 §6.1).
[database.postgres]
# "managed": ForgeBase runs the bundled PostgreSQL inside the data directory
# (<data_dir>/postgres/), started and stopped with the server. "external": a
# server you run, named by FORGEBASE_DATABASE_URL.
# Env: FORGEBASE_DATABASE_POSTGRES_MODE
mode = "managed"

# External server only. Keep the URL (it holds a password) out of this file:
# set FORGEBASE_DATABASE_URL in the environment or in .env.
# url = "postgres://forgebase:secret@db.example.com/forgebase"

# Read connections, 1..=64; writes always use one connection.
# Env: FORGEBASE_DATABASE_POSTGRES_POOL_SIZE
pool_size = 16

# Managed only. "" (default): logins through the Unix socket in the data
# directory only (`forgebase db psql`). A loopback "host:port", such as
# "127.0.0.1:5433", also accepts TCP logins from this machine; other hosts
# need TLS, which this version does not set up.
# Env: FORGEBASE_DATABASE_POSTGRES_LISTEN
listen = ""

# Managed only. An installed PostgreSQL 17+ to run instead of the bundled one,
# for example one shared read-only engine for several projects.
# Env: FORGEBASE_DATABASE_POSTGRES_ENGINE_DIR
engine_dir = ""

# Native row-level security: "off", "logins" (policies for direct database
# logins) or "enforce" (also the server's own connections).
# Env: FORGEBASE_DATABASE_POSTGRES_NATIVE_RLS
native_rls = "logins"

# Extra postgresql.conf parameters for the bundled engine. Settings ForgeBase
# manages (listen_addresses, port, shared_preload_libraries, wal_level,
# archive_command, cron.* and the rest of its deny list) are refused.
[database.postgres.settings]
# shared_buffers = "256MB"
# work_mem = "16MB"

# Accelerators (ADR-0029 §1.1): "auto" uses the extension when the server has
# it, "on" refuses to start without it, "off" always takes the portable path.
[database.postgres.extensions]
vector = "auto"   # pgvector. Env: FORGEBASE_DATABASE_POSTGRES_EXTENSIONS_VECTOR
graph = "auto"    # Apache AGE (openCypher). Env: FORGEBASE_DATABASE_POSTGRES_EXTENSIONS_GRAPH
queue = "auto"    # pgmq. Env: FORGEBASE_DATABASE_POSTGRES_EXTENSIONS_QUEUE
cron = "auto"     # pg_cron. Env: FORGEBASE_DATABASE_POSTGRES_EXTENSIONS_CRON
trigram = "auto"  # pg_trgm. Env: FORGEBASE_DATABASE_POSTGRES_EXTENSIONS_TRIGRAM

[log]
# Tracing filter, for example "info" or "forgebase=debug". Must not be empty.
# Env: FORGEBASE_LOG_LEVEL   Flag: --log-level
level = "info"

# "pretty" (human-readable) or "json" (one object per line).
# Env: FORGEBASE_LOG_FORMAT   Flag: --log-format
format = "pretty"

[resp]
# Optional Redis protocol (RESP2 and RESP3) listener for the built-in KV engine,
# so redis-cli and Redis client libraries can connect. Off by default. Every
# connection must AUTH with a ForgeBase API key or personal access token first
# (`AUTH <token>` or `AUTH <user> <token>`). There is no TLS: keep it on
# loopback or behind a tunnel/proxy. See docs/adr/0013-resp.md for the
# compatibility matrix (this is not a full Redis).
# Env: FORGEBASE_RESP_ENABLED   Flag: --resp
enabled = false

# Bind address. Env: FORGEBASE_RESP_HOST   Flag: --resp-host
host = "127.0.0.1"

# TCP port. 0 picks a free port. Env: FORGEBASE_RESP_PORT   Flag: --resp-port
port = 6380

# Most simultaneous connections (further ones are refused). Range 1..=1000000.
# Env: FORGEBASE_RESP_MAX_CONNECTIONS
max_connections = 1024

# Largest single argument (for example a value) in bytes. Range 1..=536870912.
# Env: FORGEBASE_RESP_MAX_BULK_BYTES
max_bulk_bytes = 16777216

# Close a connection idle this long, seconds (0 = never; subscribed
# connections are exempt). Env: FORGEBASE_RESP_IDLE_TIMEOUT_SECS
idle_timeout_secs = 300

[storage]
# Object storage: /api/v1/storage and its blob reconciler.
# Env: FORGEBASE_STORAGE_ENABLED
enabled = true

# Object storage (ADR-0018). "local" keeps blobs under <data_dir>/storage;
# "s3" uses an S3-compatible service. S3 credentials come from the
# environment only: FORGEBASE_STORAGE_S3_ACCESS_KEY, FORGEBASE_STORAGE_S3_SECRET_KEY
# (and optionally FORGEBASE_STORAGE_S3_SESSION_TOKEN).
driver = "local"

# Largest object in bytes (a bucket may set a lower limit). Default 5 GiB.
max_object_bytes = 5368709120

# Seconds a multipart/resumable upload session lives. Default 86400.
upload_ttl_secs = 86400

# Seconds before the reconciler removes unreferenced blobs and stale staged files.
reconcile_grace_secs = 3600

# S3 only:
# s3_endpoint = "https://s3.eu-central-1.amazonaws.com"
# s3_region = "eu-central-1"
# s3_bucket = "forgebase-blobs"
# s3_prefix = ""
# s3_part_size = 8388608

[realtime]
# WebSocket, SSE and channels under /api/v1/realtime. Off, record changes are
# still logged (server functions and queues read them) but not delivered.
# Env: FORGEBASE_REALTIME_ENABLED
enabled = true

# Most simultaneous realtime (WebSocket) connections one principal (user or
# API key) may hold. The next one is refused with 429 too_many_connections.
# Range 1 to 1000000. Env: FORGEBASE_REALTIME_MAX_CONNECTIONS_PER_PRINCIPAL
max_connections_per_principal = 32

[mcp]
# MCP server for AI agents (ADR-0030): POST /api/mcp speaks the Model Context
# Protocol, so agents such as Claude Code or Cursor can read and change what
# their API key allows (data, files, functions, jobs, users, keys, settings).
# Off by default. Agents authenticate with an API key or personal access
# token; a scoped key also needs "mcp:*". Env: FORGEBASE_MCP_ENABLED, flag --mcp
enabled = false

[billing]
# Billing (ADR-0021): plans, subscriptions, invoices, provider webhooks under
# /api/v1/billing. On by default, test mode only: live provider keys are
# refused. Set false to turn it off. Env: FORGEBASE_BILLING_ENABLED
enabled = true
# Days the webhook inspector keeps each incoming provider webhook (ADR-0032).
# Env: FORGEBASE_BILLING_WEBHOOK_LOG_RETENTION_DAYS
webhook_log_retention_days = 30

[queue]
# Durable topics and queues (ADR-0022): /api/v1/queues and its background task.
# Env: FORGEBASE_QUEUE_ENABLED
enabled = true

# Largest message in bytes (data JSON + attributes + ordering key); also the
# default limit of a topic. At most 10485760.
max_message_bytes = 1048576

# Retention of topics that do not set one, and the longest a topic may set (seconds).
default_retention_secs = 604800
max_retention_secs = 2678400

# A repeated dedup_id inside this window is accepted once (seconds; topics may override).
dedup_window_secs = 600

# Longest long-poll wait of a pull (milliseconds); keep it below the request timeout.
max_pull_wait_ms = 20000

# Interval of maintenance (expired leases, retention) and push rounds (milliseconds).
poll_interval_ms = 1000

# Push delivery: timeout of one webhook or function call (seconds), and how
# many push subscriptions are served at once.
push_timeout_secs = 10
push_concurrency = 8

# Accept http:// webhook endpoints. Local development only: webhooks must be https://.
allow_http_push = false

# Days dead-letter records are kept.
dead_letter_retention_days = 14

# Push attempt log (ADR-0031): response body bytes kept per attempt, attempts
# kept per subscription, and how long they are kept (seconds).
push_response_body_bytes = 4096
push_attempts_per_subscription = 1000
push_attempts_retention_secs = 604800

# Test sends (POST .../subscriptions/{sub}/test) per push subscription and minute.
push_test_sends_per_minute = 10

[functions]
# Server functions (ADR-0017): /api/v1/functions, record hooks and the
# after-hook dispatcher. Off, record writes skip function hooks.
# Env: FORGEBASE_FUNCTIONS_ENABLED
enabled = true

[vector]
# Vector search (ADR-0012): /api/v1/vector, index warm-up and saving.
# Env: FORGEBASE_VECTOR_ENABLED
enabled = true

[graph]
# Graph API (ADR-0006): nodes, edges and traversals under /api/v1/graph.
# Env: FORGEBASE_GRAPH_ENABLED
enabled = true

[identity]
# OIDC provider for your apps (ADR-0019: /api/auth/oidc, clients, consents,
# signing keys) and realm management (/api/v1/realms). Off, existing realms
# keep signing in. Env: FORGEBASE_IDENTITY_ENABLED
enabled = true

[access]
# Policies, roles, ACLs, organisations, teams, projects and suspensions
# (ADR-0008). Off, the API is gone but stored rules are still enforced.
# Env: FORGEBASE_ACCESS_ENABLED
enabled = true
