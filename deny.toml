# cargo-deny policy for ForgeBase. Run locally: cargo deny check
# Licence decisions: docs/adr/0002-dependencies.md (ICU crates via sqlx need
# Unicode-3.0, decided by god; SQLite is public domain and is not an SPDX id,
# so it has no entry here; its crate libsqlite3-sys is MIT).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Bundled SQLite < 3.54 in libsqlite3-sys 0.37; sqlx-sqlite 0.9.0 requires libsqlite3-sys < 0.38 so it cannot be upgraded yet. Mitigated in forgebase-db (a database whose -wal file has another page size than the header is refused before opening). Review by 2026-12-09; remove when sqlx-sqlite allows libsqlite3-sys >= 0.39. See ADR-0002." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Unpublished workspace crates (publish = false) have no licence and are not shipped as packages.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    # Wasmtime and Cranelift (server functions, FB-60, ADR-0017): Apache-2.0
    # plus the LLVM exception, which only removes obligations for binaries
    # compiled from the code. Approved by god in the FB-60 brief.
    "Apache-2.0 WITH LLVM-exception",
]
# webpki-roots ships Mozilla's CA list as data under the permissive
# CDLA-Permissive-2.0 licence; allowed for that crate only (FB-25, ADR-0015 §2).
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path (`workspace = true`); that is not a wildcard.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
